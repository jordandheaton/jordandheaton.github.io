<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>Universe Scroller — Chromosome to the Milky Way</title>
<meta name="description" content="A Powers-of-Ten style scroll journey. It opens on a leaf at human scale; scroll out to the Milky Way or down into the cell — 27 orders of magnitude, scrubbed to your scroll.">
<link rel="stylesheet" href="scroller.css?v=15">
</head>
<body>
<div id="spacer"></div>
<canvas id="view"></canvas>
<canvas id="fx-stars"></canvas>
<canvas id="fx-micro"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>

<header class="topbar">
  <span class="topbar-nav">
    <a class="back" href="../index.html" aria-label="Back to portfolio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>portfolio</span>
    </a>
    <a class="howto" href="../index.html#universe">how it works</a>
  </span>
  <span class="title">Universe Scroller</span>
</header>

<!-- chapter rail: where you are in the journey, tap a tick to jump -->
<nav id="rail" class="rail" aria-label="Journey chapters"></nav>

<div class="hud">
  <div class="label" id="label">Leaf</div>
  <div class="alt" id="alt">10 cm</div>
  <div class="exp" id="exp">10<sup>−1</sup> m</div>
</div>

<div class="progress" aria-hidden="true"><i id="fill"></i></div>

<div class="hint" id="hint"><span id="hint-text">Scroll to travel</span><b aria-hidden="true"></b></div>

<div id="loader">
  <div class="lmark">Universe Scroller</div>
  <div class="lbar"><i id="lfill"></i></div>
  <div class="lsub">Chromosome to the Milky Way</div>
</div>

<!-- Manifest inlined so the page works from file:// (double-click) as well as any
     static server. frames/manifest.json is kept on disk as the source of truth.
     Frame indices are ABSOLUTE: motion.js and starmask.js are baked against them,
     so the numbering must not be rebased.

     "openAt" is the chapter the journey OPENS on, which is deliberately not the
     first chapter. You land on the leaf at human scale and can travel either way
     from there -- down into the cell, or out to the galaxy. Everything before
     "Leaf" is reachable by scrolling UP. -->
<script type="application/json" id="manifest-data">
{
  "frameCount": 1445,
  "pad": 4,
  "pattern": "frames/frame-{i}.jpg?v=10",
  "fps": 24,
  "openAt": "Leaf",
  "chapters": [
    { "start": 0,    "end": 84,   "label": "Chromosome",           "a0": -6.0, "a1": -5.0 },
    { "start": 84,   "end": 169,  "label": "Cell nucleus",         "a0": -5.0, "a1": -4.0 },
    { "start": 169,  "end": 338,  "label": "Plant cell",           "a0": -4.0, "a1": -3.0 },
    { "start": 338,  "end": 422,  "label": "Leaf cells",           "a0": -3.0, "a1": -2.0 },
    { "start": 422,  "end": 507,  "label": "Leaf surface",         "a0": -2.0, "a1": -1.0 },
    { "start": 507,  "end": 555,  "label": "Leaf",                 "a0": -1.0, "a1": 1.0 },
    { "start": 555,  "end": 579,  "label": "Tree canopy",          "a0": 1.0,  "a1": 3.0 },
    { "start": 579,  "end": 651,  "label": "Forest",               "a0": 3.0,  "a1": 5.3 },
    { "start": 651,  "end": 675,  "label": "Continent",            "a0": 5.3,  "a1": 7.0 },
    { "start": 675,  "end": 699,  "label": "Planet Earth",         "a0": 7.0,  "a1": 8.6 },
    { "start": 699,  "end": 807,  "label": "Earth & Moon",         "a0": 8.6,  "a1": 11.2 },
    { "start": 807,  "end": 915,  "label": "Solar system",         "a0": 11.2, "a1": 12.7 },
    { "start": 915,  "end": 1071, "label": "Outer planets",        "a0": 12.7, "a1": 16.0 },
    { "start": 1071, "end": 1155, "label": "Oort cloud",           "a0": 16.0, "a1": 16.6 },
    { "start": 1155, "end": 1251, "label": "Nearest stars",        "a0": 16.6, "a1": 18.0 },
    { "start": 1251, "end": 1347, "label": "Stellar neighborhood", "a0": 18.0, "a1": 19.5 },
    { "start": 1347, "end": 1444, "label": "Milky Way",            "a0": 19.5, "a1": 21.0 }
  ]
}
</script>

<script src="motion.js?v=4"></script>
<script src="starmask.js?v=1"></script>
<script src="scroller.js?v=21"></script>
</body>
</html>

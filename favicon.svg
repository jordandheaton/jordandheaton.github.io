<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JH">
  <!-- Matches the .boot-mark / .brand-dot badge in portfolio-3d.css:
       rounded square, 135deg accent gradient, dark letters. Keep the colours
       in sync with --accent / --accent-2 if the palette ever changes. -->
  <defs>
    <linearGradient id="jh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#43e7d0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="19" fill="url(#jh)"/>
  <text x="32" y="33" fill="#04131f"
        font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="27" font-weight="700" letter-spacing="1.2"
        text-anchor="middle" dominant-baseline="central">JH</text>
</svg>

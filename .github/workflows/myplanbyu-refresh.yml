# myplanBYU weekly data refresh, off Jordan's PC.
#
# The same steps as myplanBYU/scraper/refresh_core.ps1 (Windows Task Scheduler),
# in the same order, behind the same gate (_sanity_check.py). Differences:
#   - runs on a fresh clone every time, so OneDrive can't roll back .git/index
#     (what blocked every PC publish from 2026-10-11);
#   - a failure fails the run, and GitHub emails Jordan -- that replaces the toast;
#   - manual-dispatch only for now. publish=false is a dry run: scrape, generate,
#     gate, and mirror with -NoPush, then report -- nothing reaches either site.
#
# Publishing to myplan.jordanheaton.com needs the MYPLAN_SITE_DEPLOY_KEY secret:
# a deploy key with write access on jordandheaton/myplanbyu-site.

name: myplanBYU refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to both sites (unchecked = dry run)"
        type: boolean
        default: false
      force_maps:
        description: "Re-fetch every MAP sheet, not just changed ones"
        type: boolean
        default: false

permissions:
  contents: write

# Never two refreshes at once: both would commit the same files.
concurrency:
  group: myplanbyu-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: myplanBYU/scraper
    env:
      PUBLISH: ${{ inputs.publish }}
      PYTHONUNBUFFERED: "1"
    steps:
      # The portfolio repo is ~550 MB of videos and images. A blob-less partial
      # clone limited to the two folders the refresh reads keeps this to seconds,
      # and still has full history for a rebase before pushing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            myplanBYU
            BYU Scholarship Matcher

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: myplanBYU/scraper/requirements-refresh.txt

      - name: Install dependencies
        run: pip install -r requirements-refresh.txt

      # Checked up front: a publish run that updated jordanheaton.com and then
      # failed on the subdomain would leave the two sites serving different data.
      - name: Require deploy key to publish
        if: env.PUBLISH == 'true'
        env:
          KEY: ${{ secrets.MYPLAN_SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::MYPLAN_SITE_DEPLOY_KEY is not set -- refusing to publish only one of the two sites"
            exit 1
          fi

      - name: Git identity
        run: |
          git config --global user.name "myplanBYU refresh"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --- scrape + generate (order is load-bearing; see REFRESH.md) ---------
      - name: catalog
        id: catalog
        run: python sources/catalog.py
      # BYU's CloudFront 403s runner IPs, so term dates come from the API
      # gateway; without these secrets the step falls back to the (blocked)
      # calendar page and fails non-fatally, keeping the previous file.
      - name: dates
        id: dates
        continue-on-error: true
        env:
          BYU_CLIENT_ID: ${{ secrets.BYU_CLIENT_ID }}
          BYU_CLIENT_SECRET: ${{ secrets.BYU_CLIENT_SECRET }}
        run: python sources/academic_dates.py
      - name: maps
        id: maps
        run: python sources/maps.py ${{ inputs.force_maps && '--force' || '' }}
      - name: generate
        id: generate
        run: python generate_data.py
      - name: timeline
        id: timeline
        run: python generate_timeline.py
      - name: sections
        id: sections
        continue-on-error: true
        run: python sources/class_schedule.py
      - name: schedule
        id: schedule
        continue-on-error: true
        run: python generate_schedule.py

      # continue-on-error steps report "success" to the API and show a green
      # check, so run #1's dates failure was invisible outside the summary.
      - name: Flag non-fatal failures
        if: steps.dates.outcome == 'failure' || steps.sections.outcome == 'failure' || steps.schedule.outcome == 'failure'
        run: |
          echo "::warning::Non-fatal step failed; that source keeps its previous data. dates=${{ steps.dates.outcome }} sections=${{ steps.sections.outcome }} schedule=${{ steps.schedule.outcome }}"

      # --- the publish gate --------------------------------------------------
      - name: Sanity gate
        id: gate
        run: |
          set +e
          python _sanity_check.py > "$RUNNER_TEMP/gate.json"
          code=$?
          cat "$RUNNER_TEMP/gate.json"
          if [ "$code" -ne 0 ]; then
            echo "::error::Sanity gate blocked this refresh (exit $code) -- nothing published"
            exit "$code"
          fi

      # --- jordanheaton.com/myplanBYU ---------------------------------------
      # Explicit paths only, mirroring PUBLISH_PATHS / PUBLISH_GLOB in _pipeline.ps1.
      - name: Publish data to jordanheaton.com
        id: publish
        if: env.PUBLISH == 'true'
        working-directory: .
        run: |
          python myplanBYU/scraper/_sanity_check.py --update > /dev/null
          git add -- myplanBYU/js/catalog_data.js myplanBYU/js/timeline_data.js \
                     myplanBYU/js/schedule_data.js myplanBYU/scraper/refresh_baseline.json \
                     myplanBYU/scraper/data
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit"
            exit 0
          fi
          counts=$(python - <<'PY'
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "gate.json"))).get("metrics", {})
          print(f'{m.get("js_courses")} courses, {m.get("js_programs")} programs, {m.get("health_findings")} health findings')
          PY
          )
          git commit -m "myplanBYU: scheduled data refresh ($counts)"
          git pull --rebase origin main
          git push origin HEAD:main

      # --- myplan.jordanheaton.com ------------------------------------------
      - name: Check out the subdomain deploy repo
        uses: actions/checkout@v7
        with:
          repository: jordandheaton/myplanbyu-site
          path: _deploy/myplanbyu-site
          fetch-depth: 0
          ssh-key: ${{ inputs.publish && secrets.MYPLAN_SITE_DEPLOY_KEY || '' }}

      # The same script the PC runs (PowerShell 7 ships on the runner). In a dry
      # run it commits locally with -NoPush, which still proves the mirror and
      # cache-busting work on Linux.
      - name: Mirror to myplan.jordanheaton.com
        id: mirror
        shell: pwsh
        run: |
          # Hashtable splat: an ARRAY splat into a script binds "-DeployRepo" as
          # a positional VALUE, not a parameter name (run #1 failed that way).
          $siteArgs = @{ DeployRepo = "$env:GITHUB_WORKSPACE/_deploy/myplanbyu-site" }
          if ($env:PUBLISH -ne 'true') { $siteArgs.NoPush = $true }
          & ./publish_site.ps1 @siteArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location "$env:GITHUB_WORKSPACE/_deploy/myplanbyu-site"
          git show --stat --format="%h %s" HEAD | Select-Object -First 15

      # --- report ------------------------------------------------------------
      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "## myplanBYU refresh ($([ "$PUBLISH" = true ] && echo publish || echo dry run))"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| catalog | ${{ steps.catalog.outcome }} |"
            echo "| dates | ${{ steps.dates.outcome }} |"
            echo "| maps | ${{ steps.maps.outcome }} |"
            echo "| generate | ${{ steps.generate.outcome }} |"
            echo "| timeline | ${{ steps.timeline.outcome }} |"
            echo "| sections | ${{ steps.sections.outcome }} |"
            echo "| schedule | ${{ steps.schedule.outcome }} |"
            echo "| gate | ${{ steps.gate.outcome }} |"
            echo "| publish | ${{ steps.publish.outcome }} |"
            echo "| mirror | ${{ steps.mirror.outcome }} |"
            echo
            echo "### Gate"
            echo '```json'
            cat "$RUNNER_TEMP/gate.json" 2>/dev/null || echo "(gate did not run)"
            echo '```'
            echo "### Data diff vs. the commit this run started from"
            echo '```'
            git diff --stat ${{ github.sha }} -- myplanBYU/js myplanBYU/scraper/data | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload refreshed data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myplanbyu-refresh-data
          retention-days: 14
          path: |
            myplanBYU/js/*_data.js
            myplanBYU/scraper/data/*.json
            !myplanBYU/scraper/data/catalog.json

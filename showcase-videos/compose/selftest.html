<!DOCTYPE html><meta charset="utf-8"><title>engine selftest</title>
<style>#box{position:absolute;width:100px;height:50px;background:#4da3ff}</style>
<div id="box"></div><img id="seqimg" alt="">
<script src="engine.js"></script>
<script src="cursor.js"></script>
<script src="fx.js"></script>
<script src="terminal.js"></script>
<script>
(async () => {
  const checks = [], ok = (n, c, d) => checks.push({name:n, ok:!!c, detail:String(d||'')});
  const box = document.getElementById('box'), seq = document.getElementById('seqimg');
  // 1x1 px data-uri "frame files" cannot exist as a directory; seq resolution is
  // tested via the src it ASSIGNS, not via load success.
  TL.build({fps:60, frames:120, tracks:[
    {el:box, f0:0, f1:60, ease:'linear', apply:(el,p)=>el.style.opacity = p},
    {el:seq, f0:30, f1:120, seq:{root:'no-such-dir', count:24, srcFps:24, pad:5, ext:'.jpg', prefix:'f'}},
    {f0:0, run:f=>window.__lastRun = f},
  ]});
  ok('frames global', window.__frames === 120, window.__frames);
  await window.__seek(30).catch(()=>{});          // seq img 404s — seek must not hang
  ok('opacity mid', Math.abs(parseFloat(box.style.opacity) - 0.5) < 0.02, box.style.opacity);
  ok('seq first', seq.getAttribute('src').endsWith('no-such-dir/f00000.jpg'), seq.getAttribute('src'));
  await window.__seek(90).catch(()=>{});
  ok('opacity clamped', parseFloat(box.style.opacity) === 1, box.style.opacity);
  // f=90, f0=30 -> 60 timeline frames elapsed at 60fps over 24fps source = src 24 -> clamped 23
  ok('seq mapped+clamped', seq.getAttribute('src').endsWith('f00023.jpg'), seq.getAttribute('src'));
  ok('run track', window.__lastRun === 90, window.__lastRun);
  const eb = TL.eases.outBack(0.7);
  ok('outBack overshoots', eb > 1.0 && eb < 1.15, eb);

  const log = {fps:60, events:[{f:0,kind:'hover',x:100,y:100},{f:60,kind:'click',x:700,y:400}]};
  let s = Cursor.stateAt(log, 0);
  ok('cursor start', s.x === 100 && s.y === 100 && !s.pressed, JSON.stringify(s));
  s = Cursor.stateAt(log, 30);
  ok('cursor between', s.x > 110 && s.x < 790, s.x);   // outBack overshoot is expected on long hops
  s = Cursor.stateAt(log, 62);
  ok('cursor pressed', s.pressed === true && s.ripple > 0.8, JSON.stringify(s));
  s = Cursor.stateAt(log, 100);
  ok('ripple decayed', s.ripple === 0, s.ripple);
  const host = document.createElement('div'); document.body.appendChild(host);
  const pill = FX.pill(host, 'Plan optimized');
  pill._fx(0);  ok('pill hidden at 0', getComputedStyle(pill).opacity === '0', getComputedStyle(pill).opacity);
  pill._fx(1);  ok('pill shown at 1', getComputedStyle(pill).opacity === '1', getComputedStyle(pill).opacity);
  const term = Terminal.mount(host, {title:'weekly refresh'});
  const tl3 = [{t:'ok',s:'aaaa'},{t:'ok',s:'bbbb'},{t:'gate',s:'cccc'}];
  term.update(tl3, 0.67);
  const rows = term.el.querySelectorAll('.tl-line');
  ok('terminal 2 full + 1 typing', rows.length === 3 && rows[0].textContent === 'aaaa'
     && rows[1].textContent === 'bbbb' && rows[2].textContent.length < 4, term.el.querySelector('.tbody').innerHTML);
  term.update(tl3, 1);
  const rows1 = term.el.querySelectorAll('.tl-line');
  ok('terminal full at p=1', rows1.length === 3 && rows1[2].textContent === 'cccc',
     term.el.querySelector('.tbody').innerHTML);

  // ---- Revision-1: callout / credits-roll / circle-wipe FX (Task R3) ----
  // safeRun guarantees each named check gets exactly one ok() entry even if the
  // primitive under test doesn't exist yet (RED phase) or throws mid-block.
  function safeRun(names, fn) {
    try { fn(); }
    catch (e) {
      for (const n of names) if (!checks.some(c => c.name === n)) ok(n, false, 'threw: ' + e.message);
    }
  }

  safeRun(['callout hidden at 0', 'callout shown at 1'], () => {
    const co = FX.callout(host, {x: 500, y: 300, text: 'New in v2', side: 'right'});
    const chip = co.querySelector('.fx-callout-chip');
    const line = co.querySelector('.fx-callout-line');
    co._fx(0);
    ok('callout hidden at 0', chip.style.opacity === '0' && line.style.opacity === '0',
       `chip=${chip.style.opacity} line=${line.style.opacity}`);
    co._fx(1);
    const dashoff = parseFloat(line.style.strokeDashoffset);
    ok('callout shown at 1', chip.style.opacity === '1' && dashoff < 0.01,
       `chip=${chip.style.opacity} dashoffset=${line.style.strokeDashoffset}`);
  });

  safeRun(['callout side offset'], () => {
    const bx = 400, by = 400;
    const cR = FX.callout(host, {x: bx, y: by, text: 'r', side: 'right'});
    const cL = FX.callout(host, {x: bx, y: by, text: 'l', side: 'left'});
    const cA = FX.callout(host, {x: bx, y: by, text: 'a', side: 'above'});
    const xR = parseFloat(cR.querySelector('.fx-callout-chip').style.left);
    const xL = parseFloat(cL.querySelector('.fx-callout-chip').style.left);
    const yA = parseFloat(cA.querySelector('.fx-callout-chip').style.top);
    ok('callout side offset', xR > bx + 150 && xL < bx - 150 && yA < by - 150,
       `xR=${xR} xL=${xL} yA=${yA} (base ${bx},${by})`);
  });

  safeRun(['credits mid mix', 'credits final stack'], () => {
    const cr = FX.credits(host, {lines: ['Design', 'Build', 'Ship']});
    const rows = cr.querySelectorAll('.fx-credits-line');
    cr._fx(0.5);
    const ops5 = [...rows].map(r => parseFloat(r.style.opacity));
    ok('credits mid mix', ops5.some(o => o > 0.9) && ops5.some(o => o < 0.95), JSON.stringify(ops5));
    cr._fx(1);
    const ops1 = [...rows].map(r => parseFloat(r.style.opacity));
    ok('credits final stack', rows.length === 3 && ops1[2] > 0.95 && ops1[0] < 0.7, JSON.stringify(ops1));
  });

  safeRun(['wipe covers at 0.5', 'wipe clean at 1', 'wipe clean at 0'], () => {
    const w = FX.wipe(host, {});
    w._fx(0.5);
    const m = /circle\(([\d.]+)%/.exec(w.style.clipPath);
    const r = m ? parseFloat(m[1]) : -1;
    ok('wipe covers at 0.5', r >= 130, w.style.clipPath);
    w._fx(1);
    ok('wipe clean at 1', parseFloat(w.style.opacity) === 0, w.style.opacity);
    w._fx(0);
    ok('wipe clean at 0', parseFloat(w.style.opacity) === 0, w.style.opacity);
  });

  const pass = checks.filter(c=>c.ok).length;
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({pass, fail:checks.length-pass, checks}))));
  if (location.search.includes('emit')) {
    const pre = document.createElement('pre'); pre.id = 'emit'; pre.textContent = payload;
    document.body.appendChild(pre);
  } else console.table(checks);
})();
</script>

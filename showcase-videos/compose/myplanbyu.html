  /* Page-scoped fixes only -- theme.css/engine.js/fx.js/etc. are shared components and
     stay untouched (this file is the only thing Task R8 commits).

     ==== R8 "MyMAP ad" rebuild: architecture notes ====

     10 beats, 2700 frames / 45s @60fps, replacing the whole R4/R7 timeline. Ten beats
     per the binding beat map (see docs/superpowers/specs/2026-08-08-showcase-videos-
     design.md, "Revision 2"):
       1  0-210    browser bar types the real URL; "myplanBYU" headline pops
       2  210-480  transcript import (s6) -- dynamic border highlight + zoom on scan
       3  480-750  majors list scroll (s7)
       4  750-1080 bucket expand + drag + 150f sit tail (s8) -- bucket highlights
       5  1080-1380 warnings/scholarships/abroad (s3) -- FX.ring on the real panel
       6  1380-1680 ACC 200 modal, live seat counts (s9)
       7  1680-2010 AI advisor critique chat (s10)
       8  2010-2280 terminal + tests, one quick flash (reused assets)
       9  2280-2520 three tech-component credits (FX.credits)
       10 2520-2700 outro URL typewriter on dark

     ZOOM RIG (unchanged contract from R4/R7): #zoomrig wraps #appframe AND the cursor
     layer AND the new highlight-box/ring overlays -- ALL of it shares the same
     (0,0)-(1920,1080) box as #stage, so rig-local px === stage px. Every camera move
     is written by ONE piecewise run-track (rigAt() below, driven by RIG_KF) -- single
     writer for #zoomrig's transform/transformOrigin, full stop. RIG_KF encodes an
     isometric-feel camera: long perspective (this file's #appframe rest transform
     below uses perspective(3800px), far longer than the old 2200px, with much milder
     rotateY than before -- fixes the "right side too tall" skew Jordan flagged), slow
     continuous drifts within a beat (majors scroll, insights panel) and snappy
     eased zooms BETWEEN focal points (import box, bucket board, panel buckets, ACC
     200 card) -- every switch between two DIFFERENT (x,y) targets is routed through
     an instantaneous scale-1 keyframe pair first (see the repeated {f,...,s:1} /
     {f,...(new xy),s:1} pairs in RIG_KF) so the transform-origin jump is invisible,
     exactly the trick the R4 file used between T_WIZ/T_SLAM/T_PANEL.

     NO CIRCLE WIPES anywhere in this file (Jordan: "random circles filling the
     screen") -- FX.wipe is not imported into the tracks array at all. Every beat
     boundary is a hard cut carried by the seq() images' own visibility window
     (engine.js toggles visibility outside f0..f1 automatically) plus the camera
     resetting to scale 1 at the top of the next beat.

     SIX <img class="seq-img"> layers (appS6/appS7/appS8/appS3/appS9/appS10), one per
     scene actually used in this cut -- same reason as every prior revision: seq()
     tracks write src/visibility unconditionally every frame, so N tracks sharing one
     <img> means whichever is LAST in the tracks array wins for every frame regardless
     of which beat is active. One <img> per seq track sidesteps that. s1/s2/s4/s5 are
     retired for this cut (per the design doc); s3 (insights/warnings/scholarships/
     study-abroad panel, 480 real frames) is reused for beat 5's ring moment.

     CURSOR is visible for beats 2-8 inclusive (app-UI beats, including the terminal+
     tests flash per the binding note) and explicitly absent on beats 1, 9, 10. ONE
     run-track (search "single writer for the cursor" below) drives both its opacity
     and its position for the entire 2700 frames -- no other track ever touches
     cur.layer. Beat 8 has no captured event log (it's a terminal replay, not an app
     interaction) so the cursor just rests at a fixed stage point near the terminal,
     matching "visible ... never vanishing mid-beat".

     OVERLAY HIGHLIGHTS: a small page-local helper (mkHighlight, below) draws an
     animated glowing border-box -- used for beat 2's "dynamic border highlight" over
     the real import textarea/buttons region, and for beat 4's three bucket/course
     emphasis boxes during the sit tail. Every highlight-box and the ring (FX.ring)
     get an explicit fade-out track ending before their beat's cut: {el,f0,f1,apply}
     tracks keep calling apply(el, p-clamped-to-1) on every LATER frame forever (per
     engine.js), so without an explicit fade-out any of these would bleed into every
     subsequent beat -- the same lesson documented in every prior revision's comments
     for FX.callout/FX.wipe.

     COORDINATES: every highlight box, ring center, and zoom target below was read
     directly off the real captured frames (extracted + visually inspected) in RAW
     APP-VIEWPORT space (0..1920 x 0..1080, the same space the event JSON x/y use),
     then passed through mapCur() -- the same (240 + x*0.75, 164 + y*0.75) formula
     every prior revision used for cursor placement -- to land in stage/rig space.
     Comments beside each constant note which frame + on-screen element it came from.

     Font: this page opts into DM Sans (loaded locally by theme.css's @font-face
     rules) via a --sans override scoped to THIS file only -- theme.css's own
     --sans (shared with scroller.html) is untouched. Statement copy is the exact
     copy-table text with no additions and no em dashes; DM Sans ships here at
     weights 400/500/700 only (no 800), so the big statement classes below pin
     font-weight:700 rather than relying on fx-title's default 800 synthetic bold. */
  :root{--sans:'DM Sans','Segoe UI',system-ui,sans-serif}
  #zoomrig{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .screen-frame .seq-img{position:absolute;left:0;top:45px;width:100%;height:810px;
    object-fit:cover;object-position:center}

  /* Terminal geometry carried over unchanged from the prior revision's fix (confirmed
     via direct CDP getBoundingClientRect() reads): 690px tall + 1.55 line-height fits
     all 16 SCRAPER_LOG lines, 1320px wide + a right-edge fade covers long real warn
     lines without a hard clip looking like a bug. */
  .term .tl-line{line-height:1.55}
  .term::after{content:'';position:absolute;top:40px;right:0;bottom:0;width:110px;
    background:linear-gradient(to right, transparent, #070b18 70%);pointer-events:none}

  /* Big, punchy statement copy -- 60-90px scale per the binding brief, DM Sans 700,
     bold statements rather than small caption chips. Three sizes so longer lines
     (beat 5's three-liner, beat 7's two-liner) stay comfortably under 1920px wide;
     verified against the 400px legibility sheet during iteration (see task report). */
  #titles .fx-title{font-family:'DM Sans',var(--sans);font-weight:700;
    text-shadow:0 2px 10px rgba(0,0,0,.55), 0 14px 46px rgba(3,5,12,.6)}
  #titles .fx-title.hero{font-size:132px;letter-spacing:-.01em}
  #titles .fx-title.sz2{font-size:84px}
  #titles .fx-title.sz3{font-size:76px}
  #titles .fx-title.sz4{font-size:64px}
  #creditsWrap .fx-credits-line{font:700 60px 'DM Sans',var(--sans)}

  /* Overlay highlight box -- animated glow border, page-local (not an fx.js export).
     Used for beat 2's import-area emphasis and beat 4's three bucket/course boxes. */
  .hl-box{position:absolute;box-sizing:border-box;border:3px solid var(--accent);
    border-radius:14px;pointer-events:none;z-index:36;will-change:opacity,transform,box-shadow}

  /* Outro (beat 10): dark full-stage typewriter card. */
  #outroWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
  #outroText{font:700 84px 'DM Sans',var(--sans);color:#eaf2ff;letter-spacing:-.01em}
  #outroCaret{display:inline-block;width:7px;height:74px;margin-left:10px;background:var(--accent);
    transform:translateY(6px)}

  /* Tests counter -- bumped to the page's DM Sans direction (was a small mono chip). */
  #testsCounter{font:700 46px 'DM Sans',var(--sans)}
</style>

<script>
const R = (window.RENDER && RENDER.framesRoot) || '../raw';
const stage = document.getElementById('stage');
const zoomrig = document.getElementById('zoomrig');
const appframe = document.getElementById('appframe');
const appS6 = document.getElementById('appS6');
const appS7 = document.getElementById('appS7');
const appS8 = document.getElementById('appS8');
const appS3 = document.getElementById('appS3');
const appS9 = document.getElementById('appS9');
const appS10 = document.getElementById('appS10');
const titles = document.getElementById('titles');
const creditsWrap = document.getElementById('creditsWrap');
const outroWrap = document.getElementById('outroWrap');
const outroText = document.getElementById('outroText');
const outroCaret = document.getElementById('outroCaret');
const E = TL.eases;
const p01 = (a, b, f) => Math.max(0, Math.min(1, (f - a) / (b - a)));
const lerp = (a, b, q) => a + (b - a) * q;

/* app frames are 3840x2160 captures of a 1920x1080 CSS viewport, displayed inside a
   1440px-wide frame: RAW app coords map into stage space at scale 1440/1920 = 0.75
   plus the frame's own offset (240,120) + its 44px chrome bar. Identical formula to
   every prior revision -- only ever evaluated for f>=210, by which point #appframe
   has already popped to its resting 1440x855 box (see the appframe track below). */
const mapCur = (s) => ({...s, x: 240 + s.x * 0.75, y: 164 + s.y * 0.75});
const mapPt  = (x, y) => ({x: 240 + x * 0.75, y: 164 + y * 0.75});
const mapBox = (x, y, w, h) => ({x: 240 + x * 0.75, y: 164 + y * 0.75, w: w * 0.75, h: h * 0.75});

const seq = (el, f0, f1, name, count, srcFps = 60, start = 0) =>
  ({el, f0, f1, seq: {root: R + '/myplan/' + name, count, srcFps, start}});

/* --- cursor event logs, remapped onto the master timeline ---
   s6 (import, 360 src -> 270 beat frames): srcFps 80, ratio 0.75 -> master = 210 + f*0.75.
   s7 (majors, 300 src -> 270 beat frames): srcFps 300*60/270, ratio 0.9 -> master = 480 + f*0.9.
   s8 (bucket+drag+sit, 480 src -> 330 beat frames): srcFps 480*60/330, ratio 0.6875
       -> master = 750 + f*0.6875. Drag has 10 intermediate waypoints (src 208-282),
       remapped 1:1 with the rest so the traced path lands exactly on the real drag.
   s3 (ring panel, clamped hold): only the FIRST event (f20, hover over what becomes
       the scholarships/study-abroad/clubs group once the panel has scrolled there)
       falls inside the 0-180 source window this beat actually plays (see the s3 seq()
       track below, which clamps at source frame 180 to freeze the panel for the ring)
       -- later events (the two accordion clicks) are filtered out since the clip never
       reaches them, so the cursor just holds its one real resting point, in sync with
       the frozen image. srcFps 51, ratio 60/51 -> master = 1080 + f*(60/51).
   s9 (ACC 200 modal, 300 src -> 300 beat frames): 1:1, master = 1380 + f.
   s10 (critique chat, 400 src -> 330 beat frames): srcFps 400*60/330, ratio 0.825
       -> master = 1680 + f*0.825. */
const s6log  = {fps:60, events: EVENTS_S6.events.map(e => ({...e, f: Math.round(210 + e.f * 0.75)}))};
const s7log  = {fps:60, events: EVENTS_S7.events.map(e => ({...e, f: Math.round(480 + e.f * 0.9)}))}; // 0.9 = 60/srcFps, srcFps = 300*60/270
const s8log  = {fps:60, events: EVENTS_S8.events.map(e => ({...e, f: Math.round(750 + e.f * 0.6875)}))};
const s3log  = {fps:60, events: EVENTS_S3.events.filter(e => e.f <= 180)
                                .map(e => ({...e, f: Math.round(1080 + e.f * (60/51))}))};
const s9log  = {fps:60, events: EVENTS_S9.events.map(e => ({...e, f: 1380 + e.f}))};
const s10log = {fps:60, events: EVENTS_S10.events.map(e => ({...e, f: Math.round(1680 + e.f * 0.825)}))};

/* --- beat-4 overlay highlights (page-local, not an fx.js export) --- */
function mkHighlight(box) {
  const el = document.createElement('div');
  el.className = 'hl-box';
  el.style.left = box.x + 'px'; el.style.top = box.y + 'px';
  el.style.width = box.w + 'px'; el.style.height = box.h + 'px';
  zoomrig.appendChild(el);
  el._fx = p => {
    p = Math.max(0, Math.min(1, p));
    const q = E.outBack(Math.min(1, p * 1.6));
    el.style.opacity = p <= 0 ? 0 : 1;
    el.style.transform = `scale(${0.86 + q * 0.14})`;
    const glow = 0.32 + Math.sin(Math.min(1, p) * Math.PI) * 0.38;
    el.style.boxShadow = `0 0 ${14 + Math.sin(Math.min(1, p) * Math.PI) * 20}px rgba(77,163,255,${glow})`;
  };
  el._fx(0);
  return el;
}

/* Import-area box (beat 2): read off s6/f00000-f00150 -- the "Import from your
   transcript" label through the Scan/Upload buttons row, raw viewport coords
   (560,370)-(1360,620), mapped into stage space. */

/* Beat-4 sit-tail boxes: read off a full-res crop of s8/f00290 (the settled Draft
   Plan board) -- an earlier pass measured these off the downscaled full-frame
   preview and landed ~235px too high (on the page-title/report-header row instead
   of the actual bucket cards); re-measured off a 1320x2160 crop of the left rail.
   Box 1: left rail "University Core (GE + Religion)" bucket card, raw (16,320)-(314,385).
   Box 2: left rail "Information Systems (BS)" major-bucket header, raw (16,390)-(314,443).
   Box 3: "ACC 200" course card in the Winter 2027 column, raw (674,526)-(936,566)
   (re-confirmed against the same crop -- unchanged from the first pass). */
const hlGeRel = mkHighlight(mapBox(16, 320, 298, 65));
const hlMajor = mkHighlight(mapBox(16, 390, 298, 53));
const hlAcc200 = mkHighlight(mapBox(674, 526, 262, 40));

/* Ring (beat 5): read off s3/f00150-f00180 -- the collapsed "Relevant scholarships /
   Study abroad for your college / Clubs for your college" accordion group, raw
   viewport center ~(165,1012) (matches EVENTS_S3's own flagList hover point exactly),
   half-extents ~(151,53). rx/ry padded a bit beyond the literal text box. */
const ringTarget = mapPt(165, 1012);
const ring = FX.ring(zoomrig, {x: ringTarget.x, y: ringTarget.y, rx: 155, ry: 78});

/* --- zoom rig: ONE piecewise keyframe track for the entire video (see rigAt below) ---
   Every target switch routes through an instantaneous scale-1 pair so the
   transform-origin jump is invisible (identical trick to every prior revision). */
const T_IMPORT = mapPt(960, 495);   // s6: import textarea + buttons block, center
const T_MAJORS = mapPt(960, 518);   // s7: majors dropdown list, matches its one fixed cursor point
const T_BOARD  = mapPt(596, 472);   // s8: centroid of bucket-click/card/drop points
const T_BUCKETS = mapPt(165, 385);  // s8: midpoint between the GE+Religion and Major rail rows
const T_ACC200 = mapPt(802, 546);   // s8: ACC 200 card center (same box as hlAcc200)
const T_RING   = ringTarget;        // s3: scholarships/abroad/clubs group (see ring above)
const T_MODAL  = mapPt(806, 510);   // s9: "See ... sections · live seat counts" button (EVENTS_S9 hover)
const T_CHAT   = mapPt(1650, 970);  // s10: chat panel, biased toward the input/send/quick-action corner

const RIG_KF = [
  // beat 2 -- import: hold, snap in over the scan-populate window, snap out.
  {f: 210, x: T_IMPORT.x, y: T_IMPORT.y, s: 1},
  {f: 260, x: T_IMPORT.x, y: T_IMPORT.y, s: 1},
  {f: 310, x: T_IMPORT.x, y: T_IMPORT.y, s: 1.5, ease: 'outCubic'},
  {f: 430, x: T_IMPORT.x, y: T_IMPORT.y, s: 1.5},
  {f: 460, x: T_IMPORT.x, y: T_IMPORT.y, s: 1, ease: 'inOutQuad'},

  // beat 3 -- majors: one slow continuous drift-zoom, no snaps (single fixed cursor point).
  // Lands at 749, not 750: rigAt()'s bracketing search finds the FIRST pair

function rigAt(f) {
  const kf = RIG_KF;
  if (f <= kf[0].f) return kf[0];
  if (f >= kf[kf.length - 1].f) return kf[kf.length - 1];
  let a = kf[0], b = kf[kf.length - 1];
  for (let i = 0; i < kf.length - 1; i++) {
    if (f >= kf[i].f && f <= kf[i + 1].f) { a = kf[i]; b = kf[i + 1]; break; }
  }
  if (a.f === b.f) return b;   // instantaneous target-switch pair -- see RIG_KF comment
  const q = E[b.ease || 'linear'](p01(a.f, b.f, f));
  return {x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), s: lerp(a.s, b.s, q)};
}

    else if (f < 2010) { s = 1; op = 1 - p01(2000, 2010, f); }

    appframe.style.transform = rest(s);

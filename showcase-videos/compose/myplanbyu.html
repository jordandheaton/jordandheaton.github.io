  /* Page-scoped fixes only -- theme.css/engine.js/fx.js/cursor.js/terminal.js are shared
     components and stay untouched (this file is the only thing Task R11 commits).

     ==== R11 "one continuous session" rebuild: architecture notes ====

     10 beats, 3360 frames / 56s @60fps, replacing the whole R8 timeline. Ten beats per
     the binding sequence (see docs/superpowers/specs/2026-08-08-showcase-videos-
     design.md, "Revision 3"; beat 4/5 boundary refit by R14, see below):
       1  0-210      browser bar types the real URL; "myplanBYU" headline pops
       2  210-540    majors scroll + pick (s11)
       3  540-960    transcript import -> PLAN GENERATES (s12)
       4  960-1320   bucket dropdown expand + real PHIL 201 pick (s13, R14: +30f)
       5  1320-1740  opportunities scrub: scholarships/study abroad/clubs (s14, R14: -30f)
       6  1740-2190  ACC 200 modal, live seat-count click, REAL data (s15)
       7  2190-2700  modal close -> pan to advisor -> real Q&A streams (s16)
       8  2700-2910  terminal + tests, one quick flash (reused assets)
       9  2910-3240  12-item tech stack, sequential downward dropdown reveal
       10 3240-3360  outro URL typewriter on dark

     CONTINUOUS CAMERA (the whole point of this revision): #zoomrig is driven by ONE
     piecewise run-track (rigAt() below, RIG_KF keyframes) using **translate()+scale()**
     instead of R8's transform-origin trick. R8 had to route every focal-point switch
     through an instantaneous scale-1 keyframe pair, because moving transform-origin
     while scale!=1 causes a visible jump (the origin governs where the scaled content
     expands from). translate()+scale() with transform-origin pinned to '0 0' (set once,
     see zoomrig.style.transformOrigin below) sidesteps that entirely: for any focal
     stage-point (cx,cy) that should render at the fixed screen center (960,540) under
     scale s, tx = 960 - s*cx, ty = 540 - s*cy is a closed-form, jump-free solution no
     matter how cx/cy/s all change simultaneously. This is what makes a truly continuous
     pan-while-zoomed possible -- RIG_KF below never needs to visit scale 1 again after
     the opening establishing shot, and the camera glides between all 6 scenes' focal
     points (majors list, import box, board, bucket picker, opportunities panel, ACC 200
     modal/table, chat panel) as one take. Only two hard cuts exist in the whole page:
     beat1->beat2 (browser bar gives way as the app rises) and beat7->beat8 (Vercel-
     style cutaway to the terminal) -- both flagged explicitly in the spec as the only
     sanctioned "hard visual mode changes."

     SIX <img class="seq-img"> layers (appS11..appS16), one per scene, same reason as
     every prior revision: seq() tracks write src/visibility unconditionally every
     frame, so N tracks sharing one <img> means whichever is LAST in the tracks array
     wins for every frame regardless of which beat is active. s11-s16 are ALL captured
     at native 60fps (srcFps=60, see task-r10-report.md) -- for five of the six beats
     there is NO retime, ratio = 60/srcFps = 1 exactly. The remap formula for every
     EVENTS_S1x log below is still written as `BEAT_F0 + f_src*(60/srcFps)` in full (not
     simplified to `+f_src`) because a prior revision (R8/s7) inverted this exact
     multiplier and it was only caught in review -- keeping the literal (60/srcFps) form
     here is a deliberate audit trail, even though it numerically reduces to *1 for
     s11/s12/s13/s15/s16.

     ==== R14 "continuous mouse" pass: beat refit + merged cursor log ====

     Task R13's re-capture grew s13 (bucket-pick scene) from 330 to 360 native frames
     (the real PHIL 201 pick + settle needs the room) and retargeted s11's opening click
     to the CENTERED empty-state control. Binding constraint: beats 1/8/9/10's windows
     (browserbar f0=0/f1=170; beat 8 at 2700; outro TA=3260/TB=3350) must not move, and
     the total stays 3360 -- so the extra 30 frames have to come from somewhere inside
     beats 2-7 (frames 210-2700). Fix: beat 4 (s13) grows 960-1290 -> 960-1320 (+30,
     still 1:1 -- s13's own new native length), and beat 5 (s14) gives the 30 frames
     straight back, 1290-1740 -> 1320-1740 (-30). Because beat 4's start (960) and beat
     5's end (1740) BOTH stay put, only the shared boundary between them moves --
     beats 6/7 (s15/s16) need zero timing changes at all. Beat 5's 450 native frames now
     play across a 420-frame window, so s14 alone gets `S14_SRC_FPS = 60*450/420`
     (~64.29, "scrub slightly faster is fine" per the task brief) instead of the
     literal-but-reducing-to-1 pattern every other beat uses.

     ONE MERGED CURSOR LOG (masterLog, below): Cursor.stateAt() takes a full event log
     and interpolates between whichever two POSITIONED events bracket the requested
     frame -- previously that was called separately per scene (six six-event windows,
     each internally smooth but jumping at every scene handoff, since frame f's
     bracketing pair reset to a new scene's own event list the instant f crossed a beat
     boundary). Concatenating all six remapped logs into one array and calling
     Cursor.stateAt(masterLog, f) for the WHOLE 210-2700 span removes that reset
     entirely: the bracketing pair at a former seam frame is simply "last event of scene
     N, first event of scene N+1", so the interpolation glides across the handoff
     exactly like it glides across any other gap inside a single scene. This is the
     literal fix for "the cursor never teleports" -- see the monotonicity assertion
     right after masterLog's definition, which proves by construction (not just by eye)
     that every consecutive positioned-event pair across the whole video has a strictly
     increasing frame number, i.e. Cursor.stateAt always has a well-defined forward-in-
     time bracket to interpolate within.

     Adjacent scenes' boundary frames are byte-identical (confirmed in task-r10-report.md's
     seam table) except a benign 7px pulsing "live" dot between s15/s16 -- so playing
     seq(appS11)..seq(appS16) back-to-back through the SAME zoomrig/appframe IS a single
     continuous recording, not six cuts.

     CURSOR HOTSPOT FIX: cursor.js's .cursor-layer has no explicit transform-origin, so
     it defaults to 50%/50% of its own border box -- which is exactly the <svg width=17
     height=24> element (the ripple div is position:absolute and contributes nothing to
     the layer's auto-size), i.e. origin (8.5,12). cursor.js writes
     `transform: translate(x,y) scale(pressed?1.7:2)`; scaling about a non-zero origin
     while translating by (x,y) renders the local-(0,0) point (~the SVG's own tip corner)
     at `(x + 8.5*(1-s), y + 12*(1-s))` -- NOT at (x,y). At the common unpressed scale
     (s=2) that is (x-8.5, y-12): the rendered tip sits 8.5px left and 12px ABOVE the
     intended target, which is exactly Jordan's "cursor reads too high" report (R8's own
     cursor-accuracy table only checked that translate(x,y) matched mapCur(event) --
     tautological, since cursor.js is what sets that translate from those exact values --
     and never measured where the TIP actually renders). cursor.js/theme.css are shared
     files this task does not touch, so the fix lives in the event-to-stage mapping
     instead (mapCur(), below): pre-add origin*(scale-1) to the coordinates passed as
     translate(x,y), branching on the same pressed flag Cursor.stateAt() already returns,
     which exactly cancels the origin term. Verified empirically post-render against
     zoomed click-frame crops (see task report) -- event x/y are already true element
     CENTERS (capture_myplan.py's rect() = getBoundingClientRect() center), so a correct
     fix lands the crosshair on dead-center of the clicked control.


     BEAT 9 (12-item tech stack): a page-local mkStackRow/track-generator (NOT FX.credits
     -- credits pops+dims each line as a stack that never fully commits to the newest
     line; the brief wants a real dropdown-menu feel where every line lands and STAYS at
     full opacity). 12 short pop-in tracks + 12 shared fade-out tracks are generated by a
     small loop rather than hand-duplicated 24 times.

     top) with a full-bleed 1440-wide tests screenshot and a statement parked at top:820 --
     the screenshot's own box (top:120, height 810 => bottom 930) actually covered the
     statement for its entire beat-8 window, the exact "statement overlapped by the tests

     into two non-overlapping zones: statement text pinned to y 130-310 (top of stage),
     terminal+tests both pinned to y 350-1040 (bottom), with a 40px gap between -- and
     BOTH the terminal and the tests image now reveal via clip-path self-masks (the
     terminal previously only toggled opacity; per the binding text every reveal in this
     beat must be a clip-path self-mask, zero cover rectangles).

     Font: DM Sans (loaded locally by theme.css's @font-face rules), scoped to this file
     only via --sans override (theme.css's own --sans, shared with scroller.html, is
     untouched). Statement copy is the exact copy-table text, no additions, no em dashes

     spec's own footnote). DM Sans ships at weights 400/500/700 only (no 800), so every
     big-statement class below pins font-weight:700 rather than fx-title's default 800
     synthetic bold. */

const R = (window.RENDER && RENDER.framesRoot) || '../raw';
const stage = document.getElementById('stage');

const appframe = document.getElementById('appframe');
const appS11 = document.getElementById('appS11');

const appS13 = document.getElementById('appS13');

const appS15 = document.getElementById('appS15');

const outroCaret = document.getElementById('outroCaret');
const E = TL.eases;
const p01 = (a, b, f) => Math.max(0, Math.min(1, (f - a) / (b - a)));
const lerp = (a, b, q) => a + (b - a) * q;

/* Continuous-camera contract: transform-origin pinned to (0,0) ONCE so the rig's own
   translate()+scale() writer (below) can place any focal point at the fixed screen
   center with a closed-form tx/ty -- no per-frame origin writes, no jump risk. See the
   top-of-file architecture note for the full derivation. */
zoomrig.style.transformOrigin = '0 0';

/* app frames are 3840x2160 captures of a 1920x1080 CSS viewport, displayed inside a
   1440px-wide frame: RAW app coords map into stage space at scale 1440/1920 = 0.75
   plus the frame's own offset (240,120) + its 44px chrome bar. Identical formula to
   every prior revision. */
const mapPt  = (x, y) => ({x: 240 + x * 0.75, y: 164 + y * 0.75});
const mapBox = (x, y, w, h) => ({x: 240 + x * 0.75, y: 164 + y * 0.75, w: w * 0.75, h: h * 0.75});
const mapEllipse = (cx, cy, rw, rh) => ({x: 240 + cx * 0.75, y: 164 + cy * 0.75, rx: rw * 0.75, ry: rh * 0.75});

/* Cursor hotspot fix -- see the top-of-file architecture note. CUR_OX/CUR_OY are half
   of cursor.js's own <svg width=17 height=24>, i.e. .cursor-layer's implicit 50%/50%
   transform-origin (the only in-flow content in that layer -- the ripple div is
   position:absolute and doesn't count toward its auto box size). cursor.js scales the
   layer by 2 (idle) or 1.7 (pressed, first 6 frames after a click) about that origin,
   which displaces the rendered tip by origin*(1-scale) from the (x,y) we pass as
   translate() -- pre-adding origin*(scale-1) here exactly cancels it. */
const CUR_OX = 8.5, CUR_OY = 12;
const mapCur = (s) => {
  const scale = s.pressed ? 1.7 : 2;
  const comp = scale - 1;
  return {...s, x: 240 + s.x * 0.75 + CUR_OX * comp, y: 164 + s.y * 0.75 + CUR_OY * comp};
};

const seq = (el, f0, f1, name, count, srcFps = 60, start = 0) =>
  ({el, f0, f1, seq: {root: R + '/myplan/' + name, count, srcFps, start}});

/* --- cursor event logs, remapped onto the master timeline ---
   R14 beat refit (see architecture note): beat 4 (s13) grew 960-1290 -> 960-1320 (+30,
   s13's own new 360-frame native length, still 1:1) and beat 5 (s14) gave the 30 frames
   back, 1290-1740 -> 1320-1740 (-30) -- beats 6/7 (s15/s16) keep their original offsets
   untouched since beat 5's END (1740) never moves. Every ratio below is written as the
   literal (60/srcFps) form, not simplified, as a deliberate audit trail (a prior
   revision inverted this exact multiplier and it only surfaced in review) -- true for
   five of six beats; s14 alone needs a REAL retime (450 native frames -> a 420-frame
   window, "scrub slightly faster is fine" per the task brief).
   s11 (majors scroll+pick):      beat_f0=210,  srcFps=60         -> master = 210  + f*(60/60)
   s12 (import -> generate):      beat_f0=540,  srcFps=60         -> master = 540  + f*(60/60)
   s13 (bucket expand + pick):    beat_f0=960,  srcFps=60         -> master = 960  + f*(60/60)
   s14 (opportunities scrub):     beat_f0=1320, srcFps=60*450/420 -> master = 1320 + f*(60/S14_SRC_FPS)
   s15 (ACC 200 modal + seats):   beat_f0=1740, srcFps=60         -> master = 1740 + f*(60/60)

function rigAt(f) {
  const kf = RIG_KF;
  if (f <= kf[0].f) return kf[0];
  if (f >= kf[kf.length - 1].f) return kf[kf.length - 1];
  let a = kf[0], b = kf[kf.length - 1];
  for (let i = 0; i < kf.length - 1; i++) {
    if (f >= kf[i].f && f <= kf[i + 1].f) { a = kf[i]; b = kf[i + 1]; break; }
  }
  if (a.f === b.f) return b;
  const q = E[b.ease || 'linear'](p01(a.f, b.f, f));
  return {x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), s: lerp(a.s, b.s, q)};
}
